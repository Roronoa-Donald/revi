<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page non trouvée · Cours Interactifs</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <script src="/assets/js/theme.js"></script>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; background: var(--color-bg, #f7f5f0); color: var(--color-text, #1b1b1e);
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
            padding-top: 56px;
        }
        .nf-topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 50;
            height: 56px; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--color-bg-elevated, #ffffff); border-bottom: 1px solid var(--color-border, #e4e4e7);
        }
        .nf-topbar__brand {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .92rem;
            color: var(--color-text, #1b1b1e); text-decoration: none;
        }
        .nf-topbar__brand .icon-svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; color: #006d2f; }
        .theme-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 8px;
            border: 1px solid var(--color-border, #e4e4e7); background: var(--color-bg-elevated, #ffffff);
            color: var(--color-text, #1b1b1e); cursor: pointer;
        }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle__sun, .theme-toggle__moon { display: none; }
        [data-theme="dark"] .theme-toggle__sun { display: block; }
        :root:not([data-theme="dark"]) .theme-toggle__moon { display: block; }
        .nf { text-align: center; max-width: 560px; padding: 32px 24px; }
        .nf__mark {
            width: 64px; height: 64px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            background: #21c35e; color: #00491d;
            border: 1px solid #1b1b1e; border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
        }
        .nf__code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(72px, 14vw, 128px); font-weight: 700;
            letter-spacing: -.05em; line-height: 1; color: #006d2f;
            margin-bottom: 8px;
        }
        .nf__title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700;
            letter-spacing: -.02em; margin: 0 0 10px;
        }
        .nf__text { color: var(--color-text-muted, #3d4a3d); font-size: 1rem; line-height: 1.6; margin: 0 0 28px; }
        .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .nf__actions .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 22px; border-radius: 8px; text-decoration: none;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .9rem;
            border: 2px solid #1b1b1e; box-shadow: 0 4px 0 #1b1b1e;
            background: #fff; color: #1b1b1e;
        }
        .nf__actions .btn--primary { background: #006d2f; color: #fff; }
        .nf__actions .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b1b1e; }
        .nf .icon-svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        [data-theme="dark"] body { background: #0f172a; color: #f8fafc; }
        [data-theme="dark"] .nf-topbar { background: #1e293b; border-bottom-color: #334155; }
        [data-theme="dark"] .nf-topbar__brand { color: #f8fafc; }
        [data-theme="dark"] .nf-topbar__brand .icon-svg { color: #21c35e; }
        [data-theme="dark"] .theme-toggle { background: #1e293b; border-color: #334155; color: #f8fafc; }
        [data-theme="dark"] .nf__code { color: #4ade80; }
        [data-theme="dark"] .nf__text { color: #94a3b8; }
        [data-theme="dark"] .nf__actions .btn--secondary { background: #1e293b; color: #f8fafc; border-color: #475569; box-shadow: 0 4px 0 #334155; }
    </style>
</head>
<body>
    <header class="nf-topbar" role="banner">
        <a href="/" class="nf-topbar__brand" aria-label="Retour au portail des cours">
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/assets/img/ui-icons.svg#i-house"></use></svg>
            <span>cours.interactifs</span>
        </a>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Basculer le thème clair ou sombre" title="Changer de thème">
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        </button>
    </header>
    <main class="nf">
        <div class="nf__mark" aria-hidden="true">Σ</div>
        <div class="nf__code">404</div>
        <h1 class="nf__title">Cette page n'existe pas</h1>
        <p class="nf__text">Le lien est peut-être incorrect, ou la page a été déplacée. Retourne au portail pour retrouver tes cours.</p>
        <div class="nf__actions">
            <a href="/" class="btn btn--primary"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/img/ui-icons.svg#i-arrow-left"></use></svg> Retour au portail</a>
            <a href="/preparation-web/index.html" class="btn btn--secondary">Ouvrir l'atelier</a>
        </div>
    </main>
    <script>
        document.getElementById('themeToggle')?.addEventListener('click', function () {
            if (typeof window.toggleTheme === 'function') window.toggleTheme();
        });
    </script>
</body>
</html>
