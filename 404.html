<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page non trouvée · Cours Interactifs</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <script src="/assets/js/theme.js"></script>
    <style>
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #f7f5f0; color: #1b1b1e;
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
        }
        .nf { text-align: center; max-width: 560px; padding: 32px 24px; }
        .nf__mark {
            width: 64px; height: 64px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            background: #21c35e; color: #00491d;
            border: 1px solid #1b1b1e; border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
        }
        .nf__code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(72px, 14vw, 128px); font-weight: 700;
            letter-spacing: -.05em; line-height: 1; color: #006d2f;
            margin-bottom: 8px;
        }
        .nf__title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700;
            letter-spacing: -.02em; margin: 0 0 10px;
        }
        .nf__text { color: #3d4a3d; font-size: 1rem; line-height: 1.6; margin: 0 0 28px; }
        .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .nf__actions .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 22px; border-radius: 8px; text-decoration: none;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: .9rem;
            border: 2px solid #1b1b1e; box-shadow: 0 4px 0 #1b1b1e;
            background: #fff; color: #1b1b1e;
        }
        .nf__actions .btn--primary { background: #006d2f; color: #fff; }
        .nf__actions .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b1b1e; }
        .nf .icon-svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>
    <main class="nf">
        <div class="nf__mark" aria-hidden="true">Σ</div>
        <div class="nf__code">404</div>
        <h1 class="nf__title">Cette page n'existe pas</h1>
        <p class="nf__text">Le lien est peut-être incorrect, ou la page a été déplacée. Retourne au portail pour retrouver tes cours.</p>
        <div class="nf__actions">
            <a href="/" class="btn btn--primary"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/img/ui-icons.svg#i-arrow-left"></use></svg> Retour au portail</a>
            <a href="/preparation-web/index.html" class="btn btn--secondary">Ouvrir l'atelier</a>
        </div>
    </main>
</body>
</html>
