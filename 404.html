<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page non trouvée · Cours Interactifs</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <script src="/assets/js/theme.js"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .nf { text-align: center; max-width: 520px; padding: var(--space-6); }
        .nf__code {
            font-size: clamp(64px, 12vw, 120px); font-weight: var(--weight-extrabold);
            letter-spacing: var(--tracking-tighter); line-height: 1;
            color: var(--color-primary);
        }
        .nf__title { font-size: var(--text-2xl); margin: var(--space-4) 0 var(--space-2); }
        .nf__text { color: var(--color-text-muted); margin-bottom: var(--space-6); }
        .nf .btn { text-decoration: none; }
        .nf__actions { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
        .nf .icon-svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }
    </style>
</head>
<body>
    <main class="nf">
        <div class="nf__code">404</div>
        <h1 class="nf__title">Cette page n'existe pas</h1>
        <p class="nf__text">Le lien est peut-être incorrect, ou la page a été déplacée. Retourne au portail pour retrouver tes cours.</p>
        <div class="nf__actions">
            <a href="/" class="btn btn--primary"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><use href="/assets/img/ui-icons.svg#i-arrow-left"></use></svg> Retour au portail</a>
            <a href="/preparation-web/index.html" class="btn btn--secondary">Ouvrir l'atelier</a>
        </div>
    </main>
</body>
</html>
