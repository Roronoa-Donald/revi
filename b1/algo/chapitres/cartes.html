    <style>:root{--accent:#10b981;--accent-light:#34d399;--accent-dark:#059669;--accent-glow:rgba(16,185,129,0.25)}.dark{--accent:#34d399;--accent-light:#6ee7b7;--accent-dark:#10b981;--accent-glow:rgba(52,211,153,0.25)}

    .flashcard{position:relative;width:100%;min-height:280px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s}

    .flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:1rem;padding:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card-bg);border:1px solid var(--border)}

    .fc-controls button{padding:.6rem 1.2rem;border-radius:.5rem;border:1px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:.95rem;transition:.2s}
    .fc-controls button:hover{background:var(--accent);color:#fff}
    .fc-progress{text-align:center;color:var(--text-muted);margin-bottom:1rem;font-size:.9rem}

<main class="content-wrapper">
    <div class="fc-progress" id="fc-progress">Carte 1 / 30</div>
    <div class="flashcard-container">
        <div class="flashcard" id="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="flashcard-face flashcard-front"><h3 id="fc-q">Chargement…</h3></div>
            <div class="flashcard-face flashcard-back"><p id="fc-a"></p></div>
        </div>
    </div>
    <div class="fc-controls">
        <button onclick="prevCard()"><i class="fas fa-arrow-left"></i> Précédente</button>
        <button onclick="shuffleCards()"><i class="fas fa-random"></i> Mélanger</button>
        <button onclick="nextCard()">Suivante <i class="fas fa-arrow-right"></i></button>
    </div>
</main>

<script src="../../assets/js/main.js"></script>
<script>
const cards=[
{q:"Que signifie ETS ?",a:"Entrée — Traitement — Sortie : les 3 phases d'un algorithme."},
{q:"Mnémo ERCBC ?",a:"Entier, Réel, Caractère, Booléen, Chaîne — « Elle Rit Car Bob Chante »"},
{q:"Différence entre variable et constante ?",a:"Variable = valeur modifiable. Constante = valeur fixe (MAJUSCULE par convention)."},
{q:"Opérateur ← signifie ?",a:"Affectation : on met la valeur de droite dans la variable de gauche."},
{q:"DIV vs MOD ?",a:"DIV = division entière (quotient). MOD = reste. Ex: 17 DIV 5 = 3, 17 MOD 5 = 2."},
{q:"Différence ET vs OU ?",a:"ET = les DEUX conditions vraies (strict). OU = au moins UNE vraie (généreux)."},
{q:"Attention en Pascal avant Sinon ?",a:"Pas de point-virgule (;) avant 'else' ! C'est une erreur fréquente."},
{q:"Boucle Pour : quand l'utiliser ?",a:"Quand on connaît le nombre d'itérations à l'avance."},
{q:"Différence Tant Que vs Répéter ?",a:"TQ teste AVANT (peut ne jamais exécuter). Répéter teste APRÈS (au moins 1 fois)."},
{q:"Qu'est-ce qu'un accumulateur ?",a:"Variable qui accumule des valeurs. Initialisée à 0 (somme) ou 1 (produit)."},
{q:"Mnémo T.I.P. ?",a:"Tableau = Type Identique, Indice, Plusieurs valeurs."},
{q:"Comment trouver le max d'un tableau ?",a:"max ← T[1], puis parcourir de 2 à N en comparant avec >."},
{q:"Tableau 2D : accès ?",a:"T[ligne][colonne] — 2 boucles imbriquées pour parcourir."},
{q:"Fonction vs Procédure ?",a:"Fonction = Fournit un résultat (Retourner). Procédure = Pas de résultat."},
{q:"Passage par valeur vs référence ?",a:"Valeur = copie (original intact). Référence = original modifié (var en Pascal)."},
{q:"Variable locale vs globale ?",a:"Locale = visible dans son bloc seul. Globale = visible partout (à éviter)."},
{q:"Mnémo S.B.I. ?",a:"Sélection, Bulles, Insertion — les 3 tris élémentaires."},
{q:"Tri par sélection : principe ?",a:"Cherche le minimum, échange avec la 1ère position non triée. O(n²) toujours."},
{q:"Tri à bulles : avantage ?",a:"Détecte si déjà trié (O(n) meilleur cas) grâce au drapeau échange."},
{q:"Tri par insertion : analogie ?",a:"Le joueur de cartes : insère chaque carte à sa place dans la main triée."},
{q:"Recherche dichotomique : prérequis ?",a:"Tableau TRIÉ obligatoire ! Complexité O(log n)."},
{q:"Formule du milieu ?",a:"milieu ← (gauche + droite) DIV 2. On compare T[milieu] avec la valeur."},
{q:"2 règles de la récursivité ?",a:"1) Cas de base (arrêt). 2) Progression vers le cas de base. Sinon → Stack Overflow !"},
{q:"Factorielle récursive ?",a:"fact(0) = 1, fact(n) = n × fact(n-1). Ex: fact(5) = 120."},
{q:"Pile d'appels = ?",a:"LIFO — Last In First Out. Analogie : pile de crêpes 🥞."},
{q:"Pile vs File ?",a:"Pile = LIFO (assiettes, Ctrl+Z). File = FIFO (file d'attente, imprimante)."},
{q:"Liste chaînée : avantage ?",a:"Insertion/suppression O(1). Mais accès par indice O(n) — pas d'indice direct."},
{q:"Enregistrement vs Tableau ?",a:"Tableau = même type. Enregistrement = types différents (carte d'identité)."},
{q:"O(n²) pour n=1000 ?",a:"1 000 000 opérations. C'est quadratique !"},
{q:"Ordre Grand O (rapide → lent) ?",a:"O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ)"}
];
let ci=0;
function render(){const c=cards[ci];document.getElementById('fc-q').textContent=c.q;document.getElementById('fc-a').textContent=c.a;document.getElementById('fc-progress').textContent=`Carte ${ci+1} / ${cards.length}`;document.getElementById('flashcard').classList.remove('flipped')}
function nextCard(){ci=(ci+1)%cards.length;render()}
function prevCard(){ci=(ci-1+cards.length)%cards.length;render()}
function shuffleCards(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}ci=0;render()}
render();
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')prevCard();if(e.key===' '){e.preventDefault();document.getElementById('flashcard').classList.toggle('flipped')}});
</script>
