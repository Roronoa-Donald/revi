<script src="../../assets/js/main.js"></script>
<script>
const CARDS=[
// ─── Modèle relationnel ───
{q:"Qu'est-ce qu'une relation en BD ?",a:"Une table. Colonnes = attributs, lignes = tuples, types = domaines.",tag:"Modèle"},
{q:"R.A.T.D. signifie ?",a:"Relation, Attribut, Tuple, Domaine — les 4 fondamentaux du modèle relationnel.",tag:"Modèle"},
{q:"Clé primaire : 3 propriétés U.N.I. ?",a:"Unique (pas de doublon), Non-null (jamais vide), Immuable (ne change pas).",tag:"Modèle"},
{q:"Clé étrangère (FK) ?",a:"Attribut qui référence la PK d'une autre table, créant un lien entre les deux.",tag:"Modèle"},
{q:"Relation M:N → implémentation ?",a:"Table de jonction dont la PK composée = les PK des deux entités liées.",tag:"Modèle"},
// ─── Algèbre relationnelle ───
{q:"σ (sigma) = ?",a:"Sélection : filtre les LIGNES selon une condition. SQL → WHERE.",tag:"Algèbre"},
{q:"π (pi) = ?",a:"Projection : sélectionne des COLONNES. SQL → SELECT col1, col2.",tag:"Algèbre"},
{q:"Jointure = ?",a:"R1 ⋈_θ R2 = σ_θ(R1 × R2). Produit cartésien + sélection sur condition.",tag:"Algèbre"},
{q:"U.I.D.P. = ?",a:"Union (∪), Intersection (∩), Différence (−), Produit cartésien (×).",tag:"Algèbre"},
{q:"Division R1 ÷ R2 = ?",a:"Tuples de R1 associés à TOUS les tuples de R2. Répond à « pour tout ».",tag:"Algèbre"},
// ─── SQL base ───
{q:"D.M.C. = ?",a:"DDL (Create/Alter/Drop), DML (Select/Insert/Update/Delete), DCL (Grant/Revoke).",tag:"SQL Base"},
{q:"C.R.U.D. = ?",a:"Create → INSERT, Read → SELECT, Update → UPDATE, Delete → DELETE.",tag:"SQL Base"},
{q:"WHERE email = NULL correct ?",a:"NON ! Il faut IS NULL. Rien n'est = à NULL, même pas NULL.",tag:"SQL Base"},
{q:"DELETE vs TRUNCATE vs DROP ?",a:"DELETE = supprime lignes (WHERE possible). TRUNCATE = vide table. DROP = supprime table entière.",tag:"SQL Base"},
{q:"LIKE 'D%' ?",a:"Sélectionne ce qui commence par D. % = 0+ caractères. _ = 1 caractère exactement.",tag:"SQL Base"},
// ─── SQL avancé ───
{q:"INNER JOIN vs LEFT JOIN ?",a:"INNER = correspondances seulement. LEFT = tout à gauche + correspondances (NULL sinon).",tag:"SQL Avancé"},
{q:"C.S.A.M.M. = ?",a:"COUNT, SUM, AVG, MAX, MIN — les 5 fonctions d'agrégation.",tag:"SQL Avancé"},
{q:"WHERE vs HAVING ?",a:"WHERE filtre lignes AVANT GROUP BY. HAVING filtre groupes APRÈS GROUP BY.",tag:"SQL Avancé"},
{q:"Ordre d'exécution SQL ?",a:"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.",tag:"SQL Avancé"},
{q:"COALESCE(NULL, NULL, 'X') ?",a:"Retourne 'X' — premier argument non-NULL de la liste.",tag:"SQL Avancé"},
// ─── Normalisation ───
{q:"Pourquoi normaliser ?",a:"Éliminer les anomalies I.M.S. : Insertion, Mise à jour, Suppression.",tag:"Normalisation"},
{q:"1NF ?",a:"Valeurs atomiques (pas de listes dans une cellule) + PK définie.",tag:"Normalisation"},
{q:"2NF ?",a:"1NF + pas de dépendance partielle (tous les attributs non-clé dépendent de TOUTE la clé).",tag:"Normalisation"},
{q:"3NF = « la clé, toute la clé… » ?",a:"…rien que la clé ! Pas de DF transitive (non-clé → non-clé est interdit).",tag:"Normalisation"},
{q:"BCNF ?",a:"Tout déterminant (côté gauche d'une DF) doit être une clé candidate. Plus strict que 3NF.",tag:"Normalisation"},
// ─── Conception ───
{q:"E.A.R. = ?",a:"Entité, Attribut, Relation — les 3 composants du schéma E-R.",tag:"Conception"},
{q:"Comment convertir 1:N en relationnel ?",a:"FK dans la table côté N (le 'plusieurs').",tag:"Conception"},
{q:"E.R.D.U. = ?",a:"Entité, Référentielle, Domaine, Utilisateur — les 4 types de contraintes d'intégrité.",tag:"Conception"},
{q:"A.C.L.P.N. = ?",a:"Analyse → Conceptuel (MCD) → Logique (MLD) → Physique (MPD) → Normaliser.",tag:"Conception"},
{q:"MCD vs MLD ?",a:"MCD = schéma E-R (entités, relations, cardinalités). MLD = tables, colonnes, PK, FK.",tag:"Conception"}
];
const TAGS=["Tous",...[...new Set(CARDS.map(c=>c.tag))]];
let activeTag="Tous";
const toolbar=document.getElementById('toolbar'),grid=document.getElementById('grid'),counter=document.getElementById('counter');
function render(){
    const f=activeTag==="Tous"?CARDS:CARDS.filter(c=>c.tag===activeTag);
    counter.textContent=f.length+' carte'+(f.length>1?'s':'');
    grid.innerHTML=f.map(c=>`<div class="flashcard" onclick="this.classList.toggle('flipped')" tabindex="0"><div class="flashcard-inner"><div class="flashcard-front"><span class="flashcard-tag">${c.tag}</span><h3>${c.q}</h3></div><div class="flashcard-back"><p>${c.a}</p></div></div></div>`).join('');
}
toolbar.innerHTML=TAGS.map(t=>`<button class="${t===activeTag?'active':''}" onclick="activeTag='${t}';document.querySelectorAll('.cards-toolbar button').forEach(b=>b.classList.remove('active'));this.classList.add('active');render();">${t}</button>`).join('');
render();
</script>
