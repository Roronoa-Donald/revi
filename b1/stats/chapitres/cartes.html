<script src="../../assets/js/main.js"></script>
<script>
const CARDS=[
{q:"Population vs Échantillon ?",a:"Population = ensemble complet. Échantillon = sous-groupe représentatif tiré de la population.",tag:"Séries"},
{q:"Variable qualitative vs quantitative ?",a:"Qualitative = catégories (mots). Quantitative = nombres (on peut calculer).",tag:"Séries"},
{q:"Discrète vs Continue ?",a:"Discrète = valeurs entières isolées (nb d'enfants). Continue = toute valeur dans un intervalle (taille, poids).",tag:"Séries"},
{q:"Qu'est-ce qu'une modalité ?",a:"Une valeur possible du caractère étudié. Ex: pour 'note', les modalités sont 0…20.",tag:"Séries"},
{q:"Qu'est-ce qu'un effectif ?",a:"nᵢ = nombre d'individus ayant la valeur xᵢ. Ex: 5 élèves ont eu 12.",tag:"Séries"},
{q:"Formule de la fréquence ?",a:"fᵢ = nᵢ / N. Toujours entre 0 et 1. Σfᵢ = 1.",tag:"Fréquences"},
{q:"Fréquence cumulée ?",a:"Fᵢ = f₁ + f₂ + … + fᵢ. Somme progressive. Dernière Fᵢ = 1.",tag:"Fréquences"},
{q:"Centre de classe ?",a:"cᵢ = (borne inf + borne sup) / 2. Ex: [10;20[ → centre = 15.",tag:"Fréquences"},
{q:"[a ; b[ signifie ?",a:"a est inclus, b est exclus. [10;20[ inclut 10 mais pas 20.",tag:"Fréquences"},
{q:"Vérification d'un tableau de fréquences ?",a:"Σnᵢ = N, Σfᵢ = 1, dernière Fᵢ = 1.",tag:"Fréquences"},
{q:"Formule de la moyenne ?",a:"x̄ = Σxᵢ / N (brute) ou Σ(xᵢ × nᵢ) / N (tableau) ou Σ(xᵢ × fᵢ).",tag:"Tendance"},
{q:"Médiane pour N impair ?",a:"Ranger → position (N+1)/2. Ex: N=7 → 4e valeur.",tag:"Tendance"},
{q:"Médiane pour N pair ?",a:"Moyenne des 2 valeurs centrales. Positions N/2 et N/2+1.",tag:"Tendance"},
{q:"Qu'est-ce que le mode ?",a:"La valeur la plus fréquente (effectif maximal). Peut être multiple (bimodal).",tag:"Tendance"},
{q:"Moyenne sensible aux extrêmes ?",a:"Oui ! Un outlier tire la moyenne vers lui. La médiane résiste mieux.",tag:"Tendance"},
{q:"Formule de la variance ?",a:"σ² = Σ(xᵢ−x̄)²/N. König: σ² = (Σxᵢ²/N) − x̄².",tag:"Dispersion"},
{q:"Écart-type ?",a:"σ = √σ². Même unité que les données (contrairement à la variance).",tag:"Dispersion"},
{q:"Quartiles Q1, Q2, Q3 ?",a:"Q1 = 25%, Q2 = médiane = 50%, Q3 = 75%. Découpent en 4 parts.",tag:"Dispersion"},
{q:"IQR ?",a:"Interquartile Range = Q3 − Q1. Mesure l'étalement des 50% centraux.",tag:"Dispersion"},
{q:"Boîte à moustaches ?",a:"5 valeurs: min — Q1 — Me — Q3 — max. La boîte = 50% centraux.",tag:"Dispersion"},
{q:"Barres séparées vs collées ?",a:"Séparées = données discrètes/qualitatives. Collées (histogramme) = données continues.",tag:"Graphiques"},
{q:"Angle d'un camembert ?",a:"angle = fréquence × 360°. Ex: 25% → 90°.",tag:"Graphiques"},
{q:"Ogive = ?",a:"Courbe des fréquences cumulées. Permet de lire la médiane à F = 0.5.",tag:"Graphiques"},
{q:"Quand éviter le camembert ?",a:"Plus de 6 catégories, proportions proches, données évolutives.",tag:"Graphiques"},
{q:"Histogramme vs diagramme en bâtons ?",a:"Histogramme = continu (barres larges collées). Bâtons = discret (barres fines séparées).",tag:"Graphiques"},
{q:"Coefficient de corrélation r ?",a:"r = Cov(X,Y) / (σₓ×σᵧ). Toujours entre -1 et +1.",tag:"Corrélation"},
{q:"r proche de 1 ?",a:"Forte corrélation positive. X↑ → Y↑ ensemble.",tag:"Corrélation"},
{q:"r proche de -1 ?",a:"Forte corrélation négative. X↑ → Y↓.",tag:"Corrélation"},
{q:"Droite de régression ?",a:"Y = aX + b. a = Cov/Var(X). b = ȳ − a×x̄. Passe par (x̄,ȳ).",tag:"Corrélation"},
{q:"Corrélation ≠ Causalité ?",a:"Deux variables corrélées ne signifient pas que l'une cause l'autre. Cause commune possible.",tag:"Corrélation"}
];
const TAGS=["Tous",...[...new Set(CARDS.map(c=>c.tag))]];
let activeTag="Tous";
const toolbar=document.getElementById('toolbar'),grid=document.getElementById('grid'),counter=document.getElementById('counter');
function render(){
    const f=activeTag==="Tous"?CARDS:CARDS.filter(c=>c.tag===activeTag);
    counter.textContent=f.length+' carte'+(f.length>1?'s':'');
    grid.innerHTML=f.map(c=>`<div class="flashcard" onclick="this.classList.toggle('flipped')" tabindex="0"><div class="flashcard-inner"><div class="flashcard-front"><span class="flashcard-tag">${c.tag}</span><h3>${c.q}</h3></div><div class="flashcard-back"><p>${c.a}</p></div></div></div>`).join('');
}
toolbar.innerHTML=TAGS.map(t=>`<button class="${t===activeTag?'active':''}" onclick="activeTag='${t}';document.querySelectorAll('.cards-toolbar button').forEach(b=>b.classList.remove('active'));this.classList.add('active');render();">${t}</button>`).join('');
render();
</script>
