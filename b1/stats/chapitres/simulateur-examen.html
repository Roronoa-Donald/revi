    <style>:root{--accent:#8b5cf6;--accent-light:#a78bfa;--accent-dark:#7c3aed;--accent-glow:rgba(139,92,246,0.25)}.dark{--accent:#a78bfa;--accent-light:#c4b5fd;--accent-dark:#8b5cf6;--accent-glow:rgba(167,139,250,0.25)}.sim-config{max-width:560px;margin:2rem auto;padding:2rem;background:var(--card-bg);border-radius:18px;display:flex;flex-direction:column;gap:1rem;box-shadow:0 4px 24px rgba(0,0,0,.08)}.sim-config label{font-weight:600;font-size:.93rem}.sim-config select,.sim-config input{padding:.6rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem}.sim-config button{padding:.75rem;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.2s}.sim-config button:hover{transform:translateY(-2px);box-shadow:0 6px 18px var(--accent-glow)}.quiz-area{max-width:720px;margin:2rem auto}.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-weight:600}.timer{font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:var(--accent)}.progress-bar-bg{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:1.5rem}.progress-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}.q-card{background:var(--card-bg);border-radius:18px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.06)}.q-card h3{margin-top:0;font-size:1.05rem;line-height:1.5}.q-options{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}.q-option{padding:.75rem 1rem;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:.2s;font-size:.95rem}.q-option:hover{border-color:var(--accent)}.q-option.selected{border-color:var(--accent);background:var(--accent-glow)}.q-option.correct{border-color:#10b981;background:rgba(16,185,129,.15)}.q-option.wrong{border-color:#ef4444;background:rgba(239,68,68,.15)}.q-explanation{margin-top:.75rem;padding:1rem;border-radius:12px;background:var(--accent-glow);font-size:.9rem;display:none;line-height:1.5}.q-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1rem}.q-nav button{flex:1;padding:.65rem;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:.2s}.btn-prev{background:var(--card-bg);border:2px solid var(--border)!important;color:var(--text)}.btn-next{background:var(--accent);color:#fff}.results-card{text-align:center;background:var(--card-bg);border-radius:18px;padding:3rem 2rem;max-width:540px;margin:3rem auto}.results-card h2{font-size:2rem;margin-bottom:.5rem}.results-score{font-size:4rem;font-weight:900;color:var(--accent)}.results-bar{height:14px;background:var(--border);border-radius:99px;margin:1.5rem auto;max-width:360px;overflow:hidden}.results-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 1s}.results-details{display:flex;justify-content:center;gap:2rem;margin:1.5rem 0;font-size:.95rem}.results-details span{color:var(--accent);font-weight:700}.btn-restart{padding:.75rem 2rem;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.2s;margin-top:1rem}.btn-restart:hover{transform:translateY(-2px)}</style>

<section class="hero-section" id="main-content">
    <div class="hero-badge"><i class="fas fa-graduation-cap"></i> Simulateur d'examen</div>
    <h1>📊 Prépare ton <span class="highlight">examen</span></h1>
    <p>35 questions tirées aléatoirement — chrono, score, corrections.</p>
</section>

<main class="content-wrapper">
    <div id="config-panel" class="sim-config">
        <label>Nombre de questions
            <select id="qCount"><option value="10">10</option><option value="15">15</option><option value="20" selected>20</option><option value="35">35 (Tout)</option></select>
        </label>
        <label>Chapitre
            <select id="qChapter"><option value="all" selected>Tous les chapitres</option>
                <option value="1">Ch.1 — Séries statistiques</option><option value="2">Ch.2 — Tableaux de fréquences</option>
                <option value="3">Ch.3 — Tendance centrale</option><option value="4">Ch.4 — Dispersion</option>
                <option value="5">Ch.5 — Graphiques</option><option value="6">Ch.6 — Corrélation</option></select>
        </label>
        <label>Temps (min)
            <input type="number" id="qTime" value="20" min="5" max="90" step="5">
        </label>
        <button onclick="startQuiz()"><i class="fas fa-play"></i> Lancer l'examen</button>
    </div>
    <div id="quiz-area" class="quiz-area" style="display:none"></div>
    <div id="results-area" style="display:none"></div>
</main>

<script src="../../assets/js/main.js"></script>
<script>
const BANK=[
// ─── Ch.1 Séries statistiques ───
{ch:1,q:"Quel mnémonique retenir pour Population / Échantillon / Individu ?",o:["P.E.I.","V.I.P.","P.I.E.","I.P.E."],c:0,e:"P.E.I. = Population, Échantillon, Individu — les 3 niveaux d'observation."},
{ch:1,q:"La taille d'une personne est une variable :",o:["Qualitative nominale","Quantitative discrète","Quantitative continue","Qualitative ordinale"],c:2,e:"La taille peut prendre toute valeur dans un intervalle → quantitative continue."},
{ch:1,q:"Le nombre de frères et sœurs est une variable :",o:["Quantitative continue","Qualitative nominale","Quantitative discrète","Qualitative ordinale"],c:2,e:"On compte des entiers (0, 1, 2…) → quantitative discrète."},
{ch:1,q:"Quelle est la différence entre caractère et modalité ?",o:["Caractère = ce qu'on observe, modalité = valeur possible","C'est la même chose","Caractère = échantillon, modalité = population","Modalité = variable, caractère = fréquence"],c:0,e:"Le caractère est la propriété étudiée; les modalités sont ses valeurs possibles."},
{ch:1,q:"Un sondage sur 500 personnes parmi 50 000 : le 500 est :",o:["La population","L'individu","L'échantillon","L'effectif total"],c:2,e:"500 personnes = sous-ensemble sélectionné = échantillon."},
{ch:1,q:"'Niveau de satisfaction : Très satisfait, Satisfait, Neutre, Insatisfait' est :",o:["Quantitative discrète","Qualitative ordinale","Qualitative nominale","Quantitative continue"],c:1,e:"Il y a un ordre (satisfait > neutre > insatisfait) → qualitative ordinale."},
// ─── Ch.2 Tableaux de fréquences ───
{ch:2,q:"La fréquence fᵢ d'une valeur xᵢ est :",o:["nᵢ × N","nᵢ / N","N / nᵢ","nᵢ − N"],c:1,e:"fᵢ = effectif de xᵢ divisé par l'effectif total N."},
{ch:2,q:"Que vaut la somme de toutes les fréquences ?",o:["0","N","1","Ça dépend"],c:2,e:"Σfᵢ = Σ(nᵢ/N) = N/N = 1."},
{ch:2,q:"Le centre de la classe [20 ; 30[ est :",o:["20","30","25","10"],c:2,e:"Centre = (20+30)/2 = 25."},
{ch:2,q:"La fréquence cumulée croissante Fᵢ représente :",o:["Le pourcentage d'une seule valeur","La somme des fréquences de x₁ à xᵢ","L'effectif total","La valeur maximale"],c:1,e:"Fᵢ = f₁ + f₂ + … + fᵢ, proportion d'observations ≤ xᵢ."},
{ch:2,q:"E.F.C. signifie :",o:["Effectif, Fréquence, Cumulée","Écart, Formule, Calcul","Enquête, Fiche, Courbe","Estimation, Fonction, Corrélation"],c:0,e:"Mnémonique des 3 colonnes d'un tableau statistique complet."},
{ch:2,q:"Dans [a ; b[, la borne b est :",o:["Incluse","Exclue","Optionnelle","Arrondie"],c:1,e:"Le crochet [ = inclus, le crochet [ inversé = exclu. Ici b a un [ ouvert → exclu."},
// ─── Ch.3 Tendance centrale ───
{ch:3,q:"M.M.M. rappelle :",o:["Min, Max, Mediane","Moyenne, Médiane, Mode","Masse, Milieu, Majorité","Mesure, Module, Marge"],c:1,e:"Les 3 indicateurs de tendance centrale à connaître."},
{ch:3,q:"La moyenne pondérée Σ(xᵢ × nᵢ) / N est sensible :",o:["Aux valeurs extrêmes","Aux valeurs centrales uniquement","À la médiane","Au mode"],c:0,e:"Un outlier tire la moyenne vers lui — elle est sensible aux extrêmes."},
{ch:3,q:"Si N = 11, la position de la médiane est :",o:["5","6","5,5","11"],c:1,e:"Position = (N+1)/2 = 12/2 = 6 → 6e valeur dans la série triée."},
{ch:3,q:"Le mode d'une série peut être :",o:["Unique seulement","Multiple (bimodal, trimodal…) ou inexistant","Toujours égal à la médiane","Négatif"],c:1,e:"Le mode = valeur(s) la/les plus fréquente(s). Peut être multimodal ou sans mode."},
{ch:3,q:"Quelle mesure résiste le mieux aux valeurs extrêmes ?",o:["La moyenne","Le mode","La médiane","L'écart-type"],c:2,e:"La médiane coupe en 2 moitiés : un outlier ne change pas la position médiane."},
{ch:3,q:"Si N = 8, la médiane est :",o:["La 4e valeur","La 5e valeur","La moyenne des 4e et 5e valeurs","La moyenne des 3e et 6e valeurs"],c:2,e:"N pair → Me = (x₄ + x₅)/2, positions N/2 et N/2+1."},
// ─── Ch.4 Dispersion ───
{ch:4,q:"V.É.R. rappelle :",o:["Variance, Écart-type, Racine","Valeur, Étendue, Résultat","Vérification, Estimation, Résidu","Variable, Erreur, Rapport"],c:0,e:"Variance → Écart-type = Racine de la variance."},
{ch:4,q:"La formule de König est :",o:["σ² = Σ(xᵢ−x̄)²/N","σ² = (Σxᵢ²/N) − x̄²","σ² = Σxᵢ/N","σ² = (Σxᵢ)²/N"],c:1,e:"König simplifie le calcul : σ² = moyenne des carrés − carré de la moyenne."},
{ch:4,q:"L'écart-type a la même unité que :",o:["La variance","Les données originales","Le carré des données","La fréquence"],c:1,e:"σ = √σ². La racine annule le carré → même unité que les données."},
{ch:4,q:"Q1 sépare les données en :",o:["50% et 50%","25% inférieurs et 75% supérieurs","75% inférieurs et 25% supérieurs","10% et 90%"],c:1,e:"Q1 = premier quartile = 25% des valeurs sont en dessous."},
{ch:4,q:"L'IQR (intervalle interquartile) est :",o:["Q3 − Q1","Q3 + Q1","Q2 − Q1","Max − Min"],c:0,e:"IQR = Q3 − Q1, l'étendue des 50% centraux."},
{ch:4,q:"Une valeur est outlier si elle dépasse :",o:["Q1 − 1.5×IQR ou Q3 + 1.5×IQR","La moyenne","2× l'écart-type","L'étendue"],c:0,e:"Règle classique de Tukey : valeur aberrante si hors [Q1−1.5×IQR ; Q3+1.5×IQR]."},
// ─── Ch.5 Graphiques ───
{ch:5,q:"B.C.H.P. rappelle les 4 types de graphiques :",o:["Barres, Camembert, Histogramme, Polygone","Base, Courbe, Hauteur, Point","Bilan, Calcul, Hypothèse, Preuve","Budget, Corrélation, Hypothèse, Plan"],c:0,e:"4 graphiques principaux des statistiques descriptives."},
{ch:5,q:"Un histogramme est adapté pour des données :",o:["Qualitatives nominales","Quantitatives continues regroupées en classes","Quantitatives discrètes","Toutes les données"],c:1,e:"Histogramme = barres collées pour des classes continues [a;b[."},
{ch:5,q:"L'angle dans un diagramme circulaire se calcule par :",o:["fréquence × 360°","effectif × 100","fréquence × 180°","effectif × 360°"],c:0,e:"Angle = fᵢ × 360°. Ex: 25% = 0.25 × 360 = 90°."},
{ch:5,q:"L'ogive (courbe cumulée) sert à lire :",o:["La moyenne","La médiane et les quartiles","Le mode","L'écart-type"],c:1,e:"On lit la médiane à F = 0.5 et les quartiles à F = 0.25 / 0.75 sur l'ogive."},
{ch:5,q:"Un diagramme en barres est adapté pour des données :",o:["Quantitatives continues","Qualitatives ou quantitatives discrètes","Uniquement qualitatives ordinales","Uniquement quantitatives"],c:1,e:"Barres séparées conviennent aux données discrètes ou qualitatives, chaque barre = une modalité."},
// ─── Ch.6 Corrélation ───
{ch:6,q:"Le coefficient r varie entre :",o:["-∞ et +∞","0 et 1","-1 et +1","0 et +∞"],c:2,e:"r ∈ [−1 ; +1]. Plus |r| est proche de 1, plus la corrélation est forte."},
{ch:6,q:"|r| < 0.3 indique :",o:["Forte corrélation","Corrélation modérée","Corrélation faible ou nulle","Corrélation parfaite"],c:2,e:"Faible corrélation. Les points du nuage sont très dispersés."},
{ch:6,q:"La droite de régression passe toujours par :",o:["L'origine (0,0)","Le point (x̄, ȳ)","Le point (Q1, Q3)","Aucun point fixe"],c:1,e:"Y = aX + b avec b = ȳ − ax̄, donc le point moyen (x̄,ȳ) est toujours sur la droite."},
{ch:6,q:"Corrélation élevée implique causalité ?",o:["Toujours","Jamais","Pas forcément","Seulement si r > 0.9"],c:2,e:"Corrélation ≠ causalité ! Il peut y avoir un facteur confondant ou une coïncidence."},
{ch:6,q:"a = Cov(X,Y) / Var(X) est :",o:["L'ordonnée à l'origine","Le coefficient directeur de la droite","Le coefficient de corrélation","La variance de Y"],c:1,e:"a = pente de la droite de régression linéaire Y = aX + b."},
{ch:6,q:"Cov(X,Y) = E(XY) − E(X)E(Y). Si Cov = 0 :",o:["X et Y sont indépendantes","X et Y ne sont pas linéairement corrélées","X et Y sont opposées","r = 1"],c:1,e:"Cov = 0 signifie absence de corrélation linéaire, pas forcément indépendance."}
];
let quiz=[],current=0,answers=[],timerID,timeLeft;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(){
    const n=+document.getElementById('qCount').value,ch=document.getElementById('qChapter').value,t=+document.getElementById('qTime').value;
    let pool=ch==='all'?[...BANK]:BANK.filter(q=>q.ch===+ch);
    quiz=shuffle(pool).slice(0,n);answers=new Array(quiz.length).fill(-1);current=0;timeLeft=t*60;
    document.getElementById('config-panel').style.display='none';
    document.getElementById('results-area').style.display='none';
    const area=document.getElementById('quiz-area');area.style.display='block';
    renderQ();startTimer();
}
function startTimer(){clearInterval(timerID);timerID=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timerID);finishQuiz();}renderQ();},1000);}
function fmtTime(s){const m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60);}
function renderQ(){
    const area=document.getElementById('quiz-area'),q=quiz[current],pct=((current+1)/quiz.length*100).toFixed(0);
    const answered=answers[current]>=0;
    area.innerHTML=`<div class="quiz-header"><span>Question ${current+1}/${quiz.length}</span><span class="timer"><i class="fas fa-clock"></i> ${fmtTime(timeLeft)}</span></div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div><div class="q-card"><h3>${q.q}</h3><div class="q-options">${q.o.map((o,i)=>{let cls='q-option';if(answered){if(i===q.c)cls+=' correct';if(i===answers[current]&&i!==q.c)cls+=' wrong';if(i===answers[current])cls+=' selected';}else if(i===answers[current])cls+=' selected';return`<div class="${cls}" ${answered?'':`onclick="pickAnswer(${i})"`}>${o}</div>`;}).join('')}</div>${answered?`<div class="q-explanation" style="display:block"><strong>💡 Explication :</strong> ${q.e}</div>`:''}</div><div class="q-nav">${current>0?`<button class="btn-prev" onclick="current--;renderQ()"><i class="fas fa-arrow-left"></i> Précédente</button>`:''}<button class="btn-next" onclick="${current<quiz.length-1?'current++;renderQ()':'finishQuiz()'}">${current<quiz.length-1?'Suivante <i class="fas fa-arrow-right"></i>':'Terminer <i class="fas fa-flag-checkered"></i>'}</button></div>`;
}
function pickAnswer(i){answers[current]=i;renderQ();}
function finishQuiz(){
    clearInterval(timerID);document.getElementById('quiz-area').style.display='none';
    const correct=quiz.reduce((s,q,i)=>s+(answers[i]===q.c?1:0),0),pct=Math.round(correct/quiz.length*100);
    let msg=pct>=90?'🏆 Excellent !':pct>=70?'👏 Bien joué !':pct>=50?'📈 Pas mal, continue !':'📚 Révise les chapitres !';
    document.getElementById('results-area').innerHTML=`<div class="results-card"><h2>${msg}</h2><div class="results-score">${pct}%</div><div class="results-bar"><div class="results-fill" style="width:${pct}%"></div></div><div class="results-details"><span>${correct}/${quiz.length} bonnes réponses</span></div><button class="btn-restart" onclick="location.reload()"><i class="fas fa-redo"></i> Recommencer</button></div>`;
    document.getElementById('results-area').style.display='block';
}
</script>
