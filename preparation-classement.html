<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preparation Web - Classement</title>
  <meta name="description" content="Classement B2 pour Preparation Web.">
  <link rel="stylesheet" href="preparation-web/assets/css/style.css">
  <style>
    .state-card {
      max-width: 560px; margin: 24px auto; padding: 28px 24px;
      text-align: center; border-radius: 20px;
      background: #ffffff; border: 1px solid #e4e4e4;
      box-shadow: rgba(0,0,0,0.05) 0px 4px 14px 0px;
    }
    .state-card .state-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .state-card h3,
    .state-card .state-title { font-size: 1.05rem; margin-bottom: 8px; color: #141414; }
    .state-card p { font-size: 0.88rem; color: #57534e; margin-bottom: 18px; }
    .state-card .state-cta {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 12px 24px; border-radius: 60px;
      background: #29cc57; color: #14320f; font-weight: 800; font-size: 0.9rem;
      text-decoration: none; box-shadow: #22a94c 0px 4px 0px 0px;
      transition: transform .2s, box-shadow .2s;
    }
    .state-card .state-cta:hover { transform: translateY(2px); box-shadow: #22a94c 0px 2px 0px 0px; }
    .state-card .state-cta:active { transform: translateY(4px); box-shadow: none; }
    .skeleton-row { height: 54px; border-radius: 12px; margin-bottom: 10px;
      background: linear-gradient(90deg, #f0eeec 0%, #e4e4e4 50%, #f0eeec 100%);
      background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
  <main class="workspace" style="max-width: 980px; margin: 0 auto;">
    <header class="topbar">
      <div>
        <span class="eyebrow">Preparation Web</span>
        <h1>Classement B2</h1>
      </div>
      <div class="topbar-actions">
        <a class="ghost-button" href="preparation-web/index.html">Retour atelier</a>
        <a class="ghost-button" href="index.html">Portail</a>
      </div>
    </header>

    <section class="leaderboard-section">
      <div class="section-heading">
        <span class="eyebrow">Classement</span>
        <h2>Score des participants</h2>
      </div>

      <div id="stateLoading" aria-live="polite">
        <div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>
      </div>

      <div id="leaderboard" class="leaderboard" hidden></div>
    </section>
  </main>

  <script>
    const PROJECT_COUNT = 12;
    (function() {
      const leaderboard = document.getElementById('leaderboard');
      const loading = document.getElementById('stateLoading');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
      }

      function showState(icon, title, text, ctaHref, ctaLabel) {
        loading.hidden = true;
        const div = document.createElement('div');
        div.className = 'state-card';
        div.innerHTML =
          '<div class="state-icon">' + icon + '</div>' +
          '<p class="state-title">' + esc(title) + '</p>' +
          '<p>' + esc(text) + '</p>' +
          (ctaHref ? '<a class="state-cta" href="' + esc(ctaHref) + '">' + esc(ctaLabel) + '</a>' : '');
        document.querySelector('.leaderboard-section').prepend(div);
      }

      async function loadLeaderboard() {
        try {
          const response = await fetch('/api/preparation/status', { credentials: 'include' });
          const status = await response.json();

          if (!status.enabled) {
            showState('\u{1F6E0}\uFE0F', 'Section actuellement indisponible',
              "L'atelier Preparation Web est desactive pour le moment. Reviens plus tard.",
              '/index.html', 'Retour au portail');
            return;
          }
          if (!status.authenticated) {
            showState('\u{1F511}', 'Connexion requise',
              "Active ta cl\u00e9 d'acc\u00e8s pour voir le classement.",
              '/_auth/login.html?redirect=%2Fpreparation-classement.html', 'Se connecter');
            return;
          }
          if (!status.unlocked) {
            showState('\u{1F512}', 'Section verrouill\u00e9e',
              "Saisis le mot de passe de section dans l'atelier pour voir le classement.",
              '/preparation-web/index.html', "Ouvrir l'atelier");
            return;
          }

          const resp = await fetch('/api/preparation/leaderboard', { credentials: 'include' });
          const data = await resp.json();
          const rows = (data && data.leaderboard) || [];
          if (!rows.length) {
            loading.hidden = true;
            leaderboard.hidden = false;
            leaderboard.innerHTML = '<p>Le classement apparaitra quand les participants auront valide des projets.</p>';
            return;
          }
          loading.hidden = true;
          leaderboard.hidden = false;
          leaderboard.innerHTML = rows.map((row) =>
            '<div class="leader-row">' +
            '<strong>#' + esc(row.rank) + '</strong>' +
            '<span>' + esc(row.name || 'Apprenant') + '</span>' +
            '<span>' + esc(row.xp) + ' XP</span>' +
            '<span>' + esc(row.projectsCompleted) + '/' + PROJECT_COUNT + ' projets</span>' +
            '</div>'
          ).join('');
        } catch (error) {
          showState('\u26A0\uFE0F', 'Classement indisponible',
            'Impossible de joindre le serveur pour le moment. Recharge la page dans un instant.',
            '/preparation-web/index.html', 'Retour atelier');
        }
      }

      loadLeaderboard();
    })();
  </script>
</body>
</html>
